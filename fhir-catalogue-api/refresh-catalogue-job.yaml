apiVersion: batch/v1
kind: Job
metadata:
  name: refresh-catalogue
  namespace: fhir
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: refresh-catalogue
          image: ghcr.io/datakaveri/fhir-catalogue-api:REPLACE_WITH_NEW_TAG
          command: ["python3", "refresh_catalogue.py"]
          env:
            - name: CATALOGUE_FHIR_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: FHIR_BASE_URL
            - name: FHIR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hapi-fhir-credentials
                  key: FHIR_USERNAME
            - name: FHIR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hapi-fhir-credentials
                  key: FHIR_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hapi-fhir-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hapi-fhir-credentials
                  key: POSTGRES_PASSWORD
