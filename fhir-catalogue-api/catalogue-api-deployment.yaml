apiVersion: v1
kind: ConfigMap
metadata:
  name: catalogue-api-config
  namespace: fhir
data:
  FHIR_BASE_URL: "http://fhir:8080/fhir"
  COUNT_CACHE_TTL: "300"
  APP_TITLE: "FHIR Package Catalogue API"
  APP_VERSION: "1.0.0"
  POSTGRES_HOST: "psql-postgresql-ha-pgpool.postgres.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "hapi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-api
  namespace: fhir
  labels:
    app: catalogue-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalogue-api
  template:
    metadata:
      labels:
        app: catalogue-api
    spec:
      containers:
        - name: catalogue-api
          image: ghcr.io/datakaveri/fhir-catalogue-api:REPLACE_WITH_NEW_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: FHIR_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: FHIR_BASE_URL
            - name: COUNT_CACHE_TTL
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: COUNT_CACHE_TTL
            - name: APP_TITLE
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: APP_TITLE
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: APP_VERSION
            - name: FHIR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: hapi-fhir-credentials
                  key: FHIR_USERNAME
            - name: FHIR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hapi-fhir-credentials
                  key: FHIR_PASSWORD
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: catalogue-api-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: hapi-fhir-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hapi-fhir-credentials
                  key: POSTGRES_PASSWORD

---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-api
  namespace: fhir
  labels:
    app: catalogue-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: catalogue-api
